name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # End-to-end smoke: build the index from the bundled PDFs, then run the
      # free (no-model) evaluations. Fails if any sample PDF cannot be indexed.
      - run: pnpm ingest
      - run: pnpm eval -- --corpus-mode index --dataset data/eval/sample-corpus.eval.json --split all
      - run: pnpm eval -- --split all
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t legal-bot:ci .
      - name: Container answers a question
        run: |
          docker run -d --name bot -p 3000:3000 -e PUBLIC_DEMO=true legal-bot:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/ready && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:3000/v1/ask -H 'content-type: application/json' \
            -d '{"question":"How many designated partners must an LLP have?"}' | grep -q "designated partners"
          docker rm -f bot
